<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Curriculum | BOSS Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="curriculum-admin">

        <div class="page-header">

            <h1>Curriculum Management</h1>

            <p>
                Create and manage the school curriculum.
            </p>

        </div>


        <!-- CLASS AND SESSION -->

        <div class="curriculum-settings">

            <div class="form-group">

                <label for="class-level">
                    Class / Level
                </label>

                <select id="class-level">

                    <option value="">
                        Select Class
                    </option>

                    <option value="JSS 1">
                        JSS 1
                    </option>

                    <option value="JSS 2">
                        JSS 2
                    </option>

                    <option value="JSS 3">
                        JSS 3
                    </option>

                    <option value="SS 1">
                        SS 1
                    </option>

                    <option value="SS 2">
                        SS 2
                    </option>

                    <option value="SS 3">
                        SS 3
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="academic-session">
                    Academic Session
                </label>

                <input
                    type="text"
                    id="academic-session"
                    placeholder="e.g. 2026/2027"
                >

            </div>

        </div>


        <!-- SUBJECTS -->

        <div id="subjects-container">

        </div>


        <!-- SAVE BUTTON -->

        <button
            type="button"
            id="save-curriculum"
            class="save-btn">

            Save Curriculum

        </button>

     
</button>


        <p id="curriculum-message"></p>


        <!-- SAVED CURRICULUM -->

        <div class="saved-section">

            <h2>
                Saved Curriculums
            </h2>

            <div id="saved-curriculums">

            </div>

        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</body>

</html>
