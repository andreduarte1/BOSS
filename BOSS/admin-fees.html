<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

<!-- CONTENT -->
        <div class="admin-content">

            <div class="admin-top">

                <div>
                    <p>ADMIN PANEL</p>
                    <h1>School Fees</h1>
                </div>

                <button class="logout-btn" id="logout-btn">
                    Logout
                </button>

            </div>


            <!-- FEE FORM -->
            <div class="fees-form-card">

                <h2 id="fee-form-title">
                    Add School Fee
                </h2>

                <form id="fee-form">

                    <div class="form-group">

                        <label for="class-name">
                            Class / Level
                        </label>

                        <input
                            type="text"
                            id="class-name"
                            placeholder="e.g. Primary 1"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="tuition-fee">
                            Tuition Fee (₦)
                        </label>

                        <input
                            type="number"
                            id="tuition-fee"
                            placeholder="150000"
                            min="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="admission-fee">
                            Admission Fee (₦)
                        </label>

                        <input
                            type="number"
                            id="admission-fee"
                            placeholder="20000"
                            min="0"
                            value=""
                        >

                    </div>


                    <div class="form-group">

                        <label for="other-fees">
                            Other Fees (₦)
                        </label>

                        <input
                            type="number"
                            id="other-fees"
                            placeholder="15000"
                            min="0"
                            value=""
                        >

                    </div>


                    <div class="form-group">

                        <label for="fee-description">
                            Description
                        </label>

                        <textarea
                            id="fee-description"
                            rows="4"
                            placeholder="Add any additional information about these fees..."
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="admin-submit-btn"
                        id="fee-submit-btn"
                    >
                        Add School Fee
                    </button>


                    <button
                        type="button"
                        class="cancel-edit-btn"
                        id="cancel-fee-edit"
                        style="display: none;"
                    >
                        Cancel Edit
                    </button>


                    <p id="fee-message"></p>

                </form>

            </div>


            <!-- FEE LIST -->
            <div class="fees-list-card">

                <div class="fees-list-header">

                    <div>

                        <p>SCHOOL INFORMATION</p>

                        <h2>
                            Current School Fees
                        </h2>

                    </div>

                    <span id="fee-count">
                        0 Classes
                    </span>

                </div>


                <div id="admin-fees-list">

                    <p class="empty-fees">
                        Loading school fees...
                    </p>

                </div>

            </div>

        </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

</body>

</html>
