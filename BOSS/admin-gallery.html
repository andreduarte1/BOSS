<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-manager">

    <div class="manager-heading">
        <p>CONTENT MANAGEMENT</p>
        <h2>Photo Gallery</h2>
    </div>

    <form id="gallery-upload-form">

        <div class="upload-group">
            <label for="gallery-title">Image Title</label>
            <input
                type="text"
                id="gallery-title"
                placeholder="e.g. School Event"
                required
            >
        </div>

        <div class="upload-group">
            <label for="gallery-category">Category</label>

            <select id="gallery-category" required>
                <option value="">Select category</option>
                <option value="events">School Events</option>
                <option value="students">Students</option>
                <option value="sports">Sports</option>
                <option value="classroom">Classroom</option>
            </select>
        </div>

        <div class="upload-group">
            <label for="gallery-image">Choose Image</label>
            <input
                type="file"
                id="gallery-image"
                accept="image/*"
                required
            >
        </div>

        <button type="submit" class="upload-btn">
            Upload Image
        </button>

        <p id="upload-message"></p>

    </form>

    <div class="uploaded-gallery">

    <div class="manager-heading">
        <p>GALLERY CONTENT</p>
        <h2>Uploaded Images</h2>
    </div>

    <div class="admin-gallery-grid" id="admin-gallery-grid">
        <p>Loading images...</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

</body>
</html>
